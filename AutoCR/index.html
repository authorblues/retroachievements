<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>[AutoCR] Redirecting...</title>
	</head>
	<body>
		<h1>AutoCR has relocated</h1>

		<p>AutoCR has relocated to the RetroAchievements' team GitHub account. Please update your bookmarks.</p>
		<p>You are being automatically redirected to <code id="newurl"></code> in 10 seconds...</p>

		<script>
			let urlparts = document.URL.split('#', 2)
			let params = urlparts.length == 1 ? '' : ('#' + urlparts[1]);

			let newurl = "http://retroachievements.github.io/AutoCR/" + params;
			document.getElementById('newurl').innerText = newurl;
			
			setTimeout(function(){
				window.location.href = newurl;
			}, 10000);
		</script>
	</body>
</html>
